version: 2
updates:
  - { package-ecosystem: npm, directory: /apps/web, schedule: { interval: weekly }, open-pull-requests-limit: 10, groups: { minor: { update-types: [minor, patch] } } }
  - { package-ecosystem: pip, directory: /services/inference, schedule: { interval: weekly } }
  - { package-ecosystem: docker, directory: /apps/web, schedule: { interval: weekly } }
  - { package-ecosystem: github-actions, directory: /, schedule: { interval: weekly } }
