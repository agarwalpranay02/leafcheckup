name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency: { group: ci-${{ github.ref }}, cancel-in-progress: true }

jobs:
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npm test
      - run: npm run build
        env: { NEXT_TELEMETRY_DISABLED: 1 }
      - name: End-to-end (Playwright)
        run: |
          npx playwright install --with-deps chromium
          cp .env.example .env.local
          sed -i 's|^DATABASE_URL=.*||; s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=ci-secret-0123456789abcdef0123456789abcd|; s|^API_KEY_PEPPER=.*|API_KEY_PEPPER=ci-pepper-0123456789abcdef|; s|^NEXT_PUBLIC_SITE_URL=.*|NEXT_PUBLIC_SITE_URL=http://localhost:3000|; s|^BETTER_AUTH_URL=.*|BETTER_AUTH_URL=http://localhost:3000|' .env.local
          cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/ && cp -r drizzle .next/standalone/
          (cd .next/standalone && PORT=3000 node server.js &) && npx wait-on -t 60000 http://localhost:3000/api/v1/health
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/playwright-report, retention-days: 7 }

  inference:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/inference } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: services/inference/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  # Container images for the self-hosted setup (DEPLOY.md); enable with repository variable DEPLOY_TARGET=vps
  docker:
    needs: [web, inference]
    if: github.event_name == 'push' && vars.DEPLOY_TARGET == 'vps'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    strategy:
      matrix:
        include:
          - { name: web, context: apps/web, file: apps/web/Dockerfile }
          - { name: inference, context: ., file: services/inference/Dockerfile.compose }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          provenance: mode=max
          sbom: true
          build-args: NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL || 'https://leafcheckup.com' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/leafcheckup-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/leafcheckup-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/leafcheckup-${{ matrix.name }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
